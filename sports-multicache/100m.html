<!doctype html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  >

  <title>Olympia 8-Bit — 100 m</title>

  <link
    rel="stylesheet"
    href="css/sports.css"
  >

</head>


<body>

<main class="arcade">

  <div class="cabinet">

    <div class="marquee">
      OLYMPIA 8-BIT
    </div>


    <div class="screen race-screen">


      <!-- ==============================
           START
           ============================== -->

      <div
        id="start-screen"
        class="start-screen"
      >

        <h1>
          100 METROS
        </h1>

        <p>
          THE 8-BIT SPORTS GAMES
        </p>

        <button
          id="start-button"
          type="button"
          onclick="startGame()"
        >
          START
        </button>

      </div>


      <!-- ==============================
           GAME
           ============================== -->

      <div
        id="game-screen"
        class="hidden"
      >


        <!-- ==========================
             HUD
             ========================== -->

        <div class="race-hud">

          <div class="hud-box">

            <span>
              EVENT
            </span>

            <strong>
              100 M
            </strong>

            <small>
              WR 09.58
            </small>

          </div>


          <div class="hud-box timer-box">

            <span>
              TIME
            </span>

            <strong id="timer">
              00.00
            </strong>

          </div>


          <div class="hud-box">

            <span>
              POSITION
            </span>

            <strong id="position">
              4TH
            </strong>

            <small id="distance">
              0 M
            </small>

          </div>

        </div>


        <!-- ==========================
             ESTADIO
             ========================== -->

        <div class="stadium">

          <div class="sky">

            <div class="cloud cloud1"></div>
            <div class="cloud cloud2"></div>

            <div class="flags">
              🇪🇸 🇫🇷 🇮🇹 🇩🇪 🇬🇧 🇯🇵 🇺🇸
            </div>

          </div>


          <div class="crowd">
            ● ● ● ● ● ● ● ● ● ● ● ● ● ● ● ●
          </div>


          <div class="banner">
            OLYMPIA 8-BIT
          </div>


          <!-- ========================
               PISTA
               ======================== -->

          <div class="track">

            <div class="lane lane1">

              <span class="lane-number">
                1
              </span>

              <div
                class="cpu runner"
                id="cpu1"
              >
                🏃
              </div>

              <span class="runner-name">
                CPU 1
              </span>

            </div>


            <div class="lane lane2">

              <span class="lane-number">
                2
              </span>

              <div
                class="cpu runner"
                id="cpu2"
              >
                🏃
              </div>

              <span class="runner-name">
                CPU 2
              </span>

            </div>


            <div class="lane lane3">

              <span class="lane-number">
                3
              </span>

              <div
                class="cpu runner"
                id="cpu3"
              >
                🏃
              </div>

              <span class="runner-name">
                CPU 3
              </span>

            </div>


            <div class="lane player-lane">

              <span class="lane-number">
                4
              </span>

              <div
                class="player runner"
                id="player"
              >
                🏃
              </div>

              <span class="runner-name you">
                YOU
              </span>

            </div>


            <div class="finish-line">

              <span>
                FINISH
              </span>

            </div>

          </div>


          <!-- ========================
               DISTANCIA
               ======================== -->

          <div class="distance-line">

            <span>0</span>
            <span>20</span>
            <span>40</span>
            <span>60</span>
            <span>80</span>
            <span>100</span>

          </div>

        </div>


        <!-- ==========================
             MENSAJE
             ========================== -->

        <div
          id="message"
          class="message"
        >
          READY!
        </div>


        <!-- ==========================
             CONTROLES NES
             ========================== -->

        <div class="nes-controls">

          <button
            id="buttonA"
            class="nes-button button-a"
            type="button"
          >
            A
          </button>


          <button
            id="buttonB"
            class="nes-button button-b"
            type="button"
          >
            B
          </button>

        </div>


        <!-- ==========================
             RESULTADO
             ========================== -->

        <div
          id="result"
          class="result hidden"
        >

          <div class="result-title">
            FINISH!
          </div>

          <div class="result-position">
            <span id="result-position">
              1ST PLACE
            </span>
          </div>

          <div class="result-time-label">
            TIME
          </div>

          <strong id="final-time">
            00.00
          </strong>

          <div
            id="score"
            class="result-score"
          >
            SCORE 00000
          </div>

          <button
            id="again"
            type="button"
          >
            RUN AGAIN
          </button>

          <a href="index.html">
            BACK TO EVENTS
          </a>

        </div>

      </div>

    </div>

  </div>

</main>


<script>

function startGame() {

  document
    .getElementById("start-screen")
    .classList.add("hidden");

  document
    .getElementById("game-screen")
    .classList.remove("hidden");


  try {

    if (
      !document.fullscreenElement &&
      document.documentElement.requestFullscreen
    ) {

      document.documentElement
        .requestFullscreen()
        .catch(() => {});

    }

  } catch (e) {}


  try {

    if (
      screen.orientation &&
      screen.orientation.lock
    ) {

      screen.orientation
        .lock("landscape")
        .catch(() => {});

    }

  } catch (e) {}

}

</script>


<script src="js/controller.js"></script>
<script src="js/100m.js"></script>

</body>

</html>
